[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdbx-hierarchy"
version = "0.1.0"
description = "Tool library for transforming and creating hierarchical pdb structures"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gemmi>=0.7.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
]

[project.scripts]
pdbx-hierarchy = "pdbx_hierarchy.cli:app"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "F", "W", "A", "PLC", "PLE", "PLW", "I"]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "pytest>=8.0.0",
    "mypy>=1.11.0",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
